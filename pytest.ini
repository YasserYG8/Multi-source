[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    slow: runs Whisper on real audio (a few seconds each). Skip with: pytest -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
    # Starlette suggests the new "httpx2" package; the project brief asks for httpx.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
